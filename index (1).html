<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --calc-bg: #2c3e50;
            --display-bg: #ecf0f1;
            --btn-func: #34495e;
            --btn-num: #7f8c8d;
            --btn-accent: #e67e22;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
        }

        .calculator {
            background-color: var(--calc-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .display {
            width: 100%;
            height: 60px;
            background-color: var(--display-bg);
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: right;
            padding: 10px;
            font-size: 1.5rem;
            box-sizing: border-box;
            color: #2c3e50;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.7;
        }

        .num { background-color: var(--btn-num); }
        .func { background-color: var(--btn-func); }
        .equal { 
            background-color: var(--btn-accent); 
            grid-column: span 2;
        }
        .clear { background-color: #c0392b; }

        /* Responsive adjustments */
        @media (max-width: 350px) {
            button { padding: 10px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2 style="color: white; text-align: center; margin-top: 0;">Scientific Calculator</h2>
    <input type="text" id="result" class="display" disabled>
    
    <div class="buttons">
        <!-- Row 1 -->
        <button class="func" onclick="clearDisplay()">C</button>
        <button class="func" onclick="deleteChar()">DEL</button>
        <button class="func" onclick="insert('Math.PI')">π</button>
        <button class="func" onclick="insert('Math.E')">e</button>

        <!-- Row 2 -->
        <button class="func" onclick="mathFunc('sin')">sin</button>
        <button class="func" onclick="mathFunc('cos')">cos</button>
        <button class="func" onclick="mathFunc('tan')">tan</button>
        <button class="func" onclick="insert('**')">^</button>

        <!-- Row 3 -->
        <button class="func" onclick="mathFunc('log')">log</button>
        <button class="func" onclick="mathFunc('sqrt')">√</button>
        <button class="func" onclick="insert('/')">/</button>
        <button class="func" onclick="insert('*')">×</button>

        <!-- Row 4 -->
        <button class="num" onclick="insert('7')">7</button>
        <button class="num" onclick="insert('8')">8</button>
        <button class="num" onclick="insert('9')">9</button>
        <button class="func" onclick="insert('-')">-</button>

        <!-- Row 5 -->
        <button class="num" onclick="insert('4')">4</button>
        <button class="num" onclick="insert('5')">5</button>
        <button class="num" onclick="insert('6')">6</button>
        <button class="func" onclick="insert('+')">+</button>

        <!-- Row 6 -->
        <button class="num" onclick="insert('1')">1</button>
        <button class="num" onclick="insert('2')">2</button>
        <button class="num" onclick="insert('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>

        <!-- Row 7 -->
        <button class="num" onclick="insert('0')">0</button>
        <button class="num" onclick="insert('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById('result');

    function insert(val) {
        display.value += val;
    }

    function clearDisplay() {
        display.value = "";
    }

    function deleteChar() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            // Evaluates the string as a mathematical expression
            display.value = eval(display.value);
        } catch (e) {
            display.value = "Error";
            setTimeout(clearDisplay, 1500);
        }
    }

    function mathFunc(type) {
        if (display.value === "") return;
        
        const val = parseFloat(display.value);
        let res = 0;

        switch(type) {
            case 'sin': res = Math.sin(val * Math.PI / 180); break; // Degree to Rad
            case 'cos': res = Math.cos(val * Math.PI / 180); break;
            case 'tan': res = Math.tan(val * Math.PI / 180); break;
            case 'log': res = Math.log10(val); break;
            case 'sqrt': res = Math.sqrt(val); break;
        }
        display.value = res;
    }
</script>

</body>
</html>
